                                  "d": iso(ds[0]), "end": iso(ds[1]) if len(ds) > 1 else None, "tba": False,
                                  "v": city.title(), "a": "", "city": city.title(), "lat": None, "lon": None,
                                  "races": [{"name": "HYROX", "disc": "hyrox", "km": 8, "dplus": 0, "date": iso(ds[0])}],
                                  "p": None, "pop": 0, "img": img.group(1) if img else "", "link": r["link"], "lineup": [], "desc": ""})
                  if len(rows) < 100:
                      break
              log(f"  HYROX: {len(out)} étapes en France")
              return out


