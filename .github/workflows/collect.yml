          MARCHES_URL = "https://www.data.gouv.fr/api/1/datasets/r/db96deb6-d830-4192-bb06-34a11568c47a"  # GeoJSON
          JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"]


          def _hour(x, default):
              m = re.search(r"(\d{1,2})\s*[h:.]\s*(\d{2})?", str(x or ""))
              return f"{int(m.group(1)):02d}:{m.group(2) or '00'}" if m else default


          def marches(city):
              """Les marchés découverts de Paris (alimentaires, bio, fleurs, puces, brocante, création) sur les 14 prochains jours."""
              if slug(city) != "paris":
                  return []
              j = json.loads(get(MARCHES_URL))
              out, today = [], dt.date.today()
              for f in j.get("features") or []:
                  p = {str(k).lower(): v for k, v in (f.get("properties") or {}).items()}
                  name = (p.get("nom_long") or p.get("nom_court") or "").strip()
                  if not name:
                      continue
                  pts = []
                  def walk(c):
                      if isinstance(c, (list, tuple)) and len(c) == 2 and all(isinstance(x, (int, float)) for x in c):
                          pts.append(c)
                      elif isinstance(c, (list, tuple)):
                          for x in c:
                              walk(x)
                  walk((f.get("geometry") or {}).get("coordinates"))
                  gp = p.get("geo_point_2d")
                  if isinstance(gp, (list, tuple)) and len(gp) == 2:
                      lat, lon = gp
                  elif isinstance(gp, dict):
                      lat, lon = gp.get("lat"), gp.get("lon")
                  elif pts:
                      lon, lat = sum(x[0] for x in pts) / len(pts), sum(x[1] for x in pts) / len(pts)
                  else:
                      lat = lon = None
                  prod = str(p.get("produit") or "")
                  brocante = re.search(r"puces|brocante|antiquit", prod, re.I)
                  title = name if re.match(r"(?i)march|puces", name) else "Marché " + name
                  days = [i for i, jn in enumerate(JOURS) if str(p.get(jn) or "0") in ("1", "1.0", "True", "true", "oui")]
                  if not days:
                      txt = norm_txt(p.get("jours_tenue") or "")
                      days = [i for i, jn in enumerate(JOURS) if jn in txt]
                  if not days:
                      continue
                  # un seul événement par marché : prochain jour de tenue, et les jours de la semaine (le filtre de dates de l'app s'en sert)
                  n = next(n for n in range(8) if (today + dt.timedelta(days=n)).weekday() in days)
                  day = today + dt.timedelta(days=n)
                  wd = day.weekday()
                  h0 = _hour(p.get("h_deb_dim") if wd == 6 else p.get("h_deb_sam") if wd == 5 else p.get("h_deb_sem_1"), "08:00")
                  h1 = _hour(p.get("h_fin_dim") if wd == 6 else p.get("h_fin_sam") if wd == 5 else p.get("h_fin_sem_1"), "13:30")
                  jours = ", ".join(JOURS[i][:3] + "." for i in days) if len(days) < 7 else "Tous les jours"
                  ar = f"Paris {p.get('ardt')}e" if p.get("ardt") else "Paris"
                  out.append({"id": f"m-{p.get('id_marche') or slug(name)}", "src": "marches", "kind": "local", "market": True,
                              "t": title, "d": f"{day.isoformat()}T{h0}", "end": f"{day.isoformat()}T{h1}", "days": days,
                              "w": f"{jours} · {h0.replace(':', 'h')}–{h1.replace(':', 'h')}",
                              "v": (p.get("localisation") or "").strip()[:120], "a": ar, "city": "Paris",
                              "lat": float(lat) if lat else None, "lon": float(lon) if lon else None, "p": 0, "free": True,
                              "tags": ["Brocante" if brocante else "Marché"] + [x for x in re.split(r"\s{2,}|,|/", prod) if x.strip()][:4],
                              "desc": prod, "img": "", "lineup": [],
                              "link": "https://www.paris.fr/lieux?type=marches"})
              log(f"  Marchés de Paris : {len(out)} marchés")
              return out


