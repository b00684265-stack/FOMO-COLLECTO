          # ---------------- Ticketac (Paris) ----------------
          def ent(s):
              return html.unescape(s or "").strip()


          def ticketac(city):
              if slug(city) != "paris":
                  return []
              slugs = []
              for path, kind in [("/reservation-theatre.htm", "theatre"), ("/reservation-one-man-show-et-cafe-theatre.htm", "humour")]:
                  try:
                      listing = get("https://www.ticketac.com" + path)
                  except Exception as e:  # noqa: BLE001
                      log(f"  Ticketac {path}: {e}")
                      continue
                  slugs += [(x, kind) for x in uniq(re.findall(r'href="(?:https://www\.ticketac\.com)?/spectacles/([a-z0-9-]+)(?:\.htm)?"', listing))[:LIMITS["tac"] // 2]]
                  time.sleep(PAUSE)
              log(f"  Ticketac: {len(slugs)} spectacles listés")
              out = []
              seen = set()
              slugs = [(i, k) for i, k in slugs if not (i in seen or seen.add(i))]
              for sl, kind in slugs:
                  time.sleep(PAUSE)
                  try:
                      p = get(f"https://www.ticketac.com/spectacles/{sl}")
                  except Exception as e:  # noqa: BLE001
                      log("   ! ", sl, e)
                      continue
                  meta = dict((k, ent(v)) for k, v in re.findall(r'<meta[^>]+(?:property|name)="([^"]+)"[^>]+content="([^"]*)"', p))
                  title = meta.get("og:title", "").split("|")[0].strip()
                  if not title:
                      continue
                  price = re.search(r'"products":\[\{"name":"[^"]*","id":"[^"]*","price":"?([\d.]+)', p)
                  kw = [k.strip() for k in meta.get("keywords", "").split(",") if k.strip()]
                  venue = next((k for k in kw if re.search(r"th[eé][aâ]tre|salle|com[eé]die|caf[eé]|op[eé]ra|bouffes|palais|scala|olympia|casino", k, re.I)), "")
                  out.append({"id": "t-" + sl, "src": "tac", "kind": kind, "t": title.title() if title.isupper() else title,
                              "d": None, "noDate": True, "end": None, "v": venue.title(), "a": "", "city": "Paris",
                              "lat": None, "lon": None, "p": round(float(price.group(1))) if price else None, "soldout": False,
                              "img": meta.get("og:image", ""), "link": f"https://www.ticketac.com/spectacles/{sl}",
                              "lineup": [], "desc": meta.get("og:description", meta.get("description", ""))[:500]})
              return out


          SOURCES = {"sg": shotgun, "ra": resident_advisor, "dice": dice, "fnac": fnac, "br": billetreduc, "tac": ticketac, "offi": offi_expos}


          def main():
              cfg = json.load(open(os.path.join(ROOT, "config", "cities.json"), encoding="utf-8"))
              cities = [c for c in uniq([cfg.get("home", "Paris")] + cfg.get("cities", [])) if slug(c) in FR_CITIES][:6] or ["Paris"]
              os.makedirs(DATA, exist_ok=True)
              idx_path = os.path.join(DATA, "index.json")
              index = json.load(open(idx_path, encoding="utf-8")) if os.path.exists(idx_path) else {"cities": {}}
              now = dt.datetime.now(dt.timezone.utc)

              def save_index():
                  # enregistré après chaque étape : si la collecte est interrompue, ce qui est déjà fait reste lisible par l'app
                  index["updated"] = dt.datetime.now(dt.timezone.utc).isoformat()
                  json.dump(index, open(idx_path, "w", encoding="utf-8"), ensure_ascii=False, indent=1)

              for city in cities:
                  log(f"== {city}")
                  events, report = [], {}
                  for key, fn in SOURCES.items():
                      try:
                          got = fn(city)
                          report[key] = {"n": len(got)}
                          events += got
                      except Exception as e:  # noqa: BLE001
                          report[key] = {"n": 0, "err": str(e)[:200]}
                          log(f"  {key} : échec ({e})")
                  # on garde les événements à venir (et ceux sans date, Ticketac), sans doublon
                  keep, seen_ids = [], set()
                  for e in events:
                      if e.get("id") in seen_ids:
                          continue
                      seen_ids.add(e.get("id"))
                      if e.get("noDate"):
                          keep.append(e)
                          continue
                      if e.get("kind") == "expo" and (e.get("end") or "") >= now.isoformat()[:10]:
                          keep.append(e)
                          continue
                      try:
                          d = dt.datetime.fromisoformat(str(e["d"]).replace("Z", "+00:00"))
                          if d.tzinfo is None:
                              d = d.replace(tzinfo=dt.timezone(dt.timedelta(hours=2)))
                          if d > now - dt.timedelta(hours=6):
                              keep.append(e)
                      except Exception:  # noqa: BLE001
                          pass
                  s = slug(city)
                  prev_path = os.path.join(DATA, s + ".json")
                  if report.get("sg", {}).get("err") and os.path.exists(prev_path):
                      try:
                          old = json.load(open(prev_path, encoding="utf-8"))
                          kept = [e for e in old.get("events", []) if e.get("src") == "sg"]
                          if kept:
                              events_sg = [e for e in kept if e.get("d") and e["d"] > now.isoformat()[:10]]
                              keep += events_sg
                              report["sg"]["kept"] = len(events_sg)
                      except Exception:  # noqa: BLE001
                          pass
                  json.dump({"city": city, "updated": now.isoformat(), "sources": report, "events": keep},
                            open(os.path.join(DATA, s + ".json"), "w", encoding="utf-8"), ensure_ascii=False)
                  index["cities"][s] = {"name": city, "updated": now.isoformat(), "n": len(keep), "sources": report}
                  log(f"  => {len(keep)} événements écrits dans data/{s}.json")
                  save_index()
              try:
                  fest = []
                  try:
                      fest += ra_festivals()
                  except Exception as e:  # noqa: BLE001
                      log(f"  RA festivals : échec ({e})")
                  try:
                      fest += [e for e in shotgun_festivals() if e.get("d")]
                  except Exception as e:  # noqa: BLE001
                      log(f"  Shotgun festivals : échec ({e})")
                  json.dump({"city": "France", "updated": now.isoformat(), "sources": {"festivals": {"n": len(fest)}}, "events": fest},
                            open(os.path.join(DATA, "france.json"), "w", encoding="utf-8"), ensure_ascii=False)
                  index["cities"]["france"] = {"name": "Festivals", "updated": now.isoformat(), "n": len(fest), "sources": {"festivals": {"n": len(fest)}}}
              except Exception as e:  # noqa: BLE001
                  log(f"  festivals : échec ({e})")
                  index["cities"].setdefault("france", {"name": "France (festivals)", "n": 0})["sources"] = {"sg": {"n": 0, "err": str(e)[:200]}}
              def save_national(name, label, fn):
                  try:
                      seen_ids = set()
                      evs = [e for e in fn() if not (e.get("id") in seen_ids or seen_ids.add(e.get("id")))]
                      json.dump({"city": label, "updated": now.isoformat(), "sources": {name: {"n": len(evs)}}, "events": evs},
                                open(os.path.join(DATA, name + ".json"), "w", encoding="utf-8"), ensure_ascii=False)
                      index["cities"][name] = {"name": label, "updated": now.isoformat(), "n": len(evs), "sources": {name: {"n": len(evs)}}}
                  except Exception as e:  # noqa: BLE001
                      log(f"  {label} : échec ({e})")
                      index["cities"].setdefault(name, {"name": label, "n": 0})["sources"] = {name: {"n": 0, "err": str(e)[:200]}}

              save_index()
              save_national("sports", "Sport (France)", sports)
              save_index()
              # courses : toutes les épreuves de France sur 12 mois
              save_national("races", "Courses (France)", races_all)
              save_index()
              save_national("artists", "Dates de tes artistes", lambda: ra_artists(cfg.get("artists") or []) + bandsintown(cfg.get("artists") or [], cfg.get("bit_app_id") or ""))
              index["updated"] = now.isoformat()
              json.dump(index, open(idx_path, "w", encoding="utf-8"), ensure_ascii=False, indent=1)


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python collector/collect.py
      - name: Enregistrer les fichiers
        run: |
          git config user.name "fomo-bot"
          git config user.email "fomo-bot@users.noreply.github.com"
          # on met de côté les fichiers produits, puis on les pose sur la dernière version du dépôt :
          # aucun conflit possible, même si une autre collecte ou l'app FOMO a écrit entre-temps
          mkdir -p /tmp/fomo-data && cp -r data/. /tmp/fomo-data/
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data && cp -r /tmp/fomo-data/. data/
            git add data
            git diff --cached --quiet && exit 0
            git commit -m "Mise à jour des événements"
            git push origin HEAD:main && exit 0
            echo "Le dépôt a changé pendant l'envoi, nouvel essai ($i)"
            sleep $((i * 5))
          done
          exit 1
