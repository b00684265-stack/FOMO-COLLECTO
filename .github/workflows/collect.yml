          def _lbl(x):
              if isinstance(x, dict):
                  v = x.get("fr") or x.get("@value") or next(iter(x.values()), "")
                  return v[0] if isinstance(v, list) and v else v if isinstance(v, str) else ""
              if isinstance(x, list):
                  return _lbl(x[0]) if x else ""
              return x if isinstance(x, str) else ""


          def _find(o, keys, depth=0):
              """Première valeur trouvée pour une des clés, en profondeur (le format DATAtourisme est très imbriqué)."""
              if depth > 6:
                  return None
              if isinstance(o, dict):
                  for k in keys:
                      if k in o and o[k] not in (None, "", []):
                          return o[k]
                  for v in o.values():
                      r = _find(v, keys, depth + 1)
                      if r is not None:
                          return r
              elif isinstance(o, list):
                  for v in o:
                      r = _find(v, keys, depth + 1)
                      if r is not None:
                          return r
              return None


          def _dt_periods(o):
              tp = o.get("takesPlaceAt") or _find(o, ["takesPlaceAt"]) or []
              tp = tp if isinstance(tp, list) else [tp]
              out = []
              for p in tp:
                  if not isinstance(p, dict):
                      continue
                  st = _lbl(p.get("startDate") or p.get("schema:startDate"))
                  en = _lbl(p.get("endDate") or p.get("schema:endDate")) or st
                  if isinstance(st, str) and len(st) >= 10:
                      out.append((st, en if isinstance(en, str) and len(en) >= 10 else st, _lbl(p.get("startTime") or "")))
              return sorted(out)


          def _dt_geo(o):
              la, lo = _find(o, ["latitude", "schema:latitude", "lat"]), _find(o, ["longitude", "schema:longitude", "lon", "lng"])
              if la is None or lo is None:
                  gp = _find(o, ["geoPoint", "geo"])
                  if isinstance(gp, str) and "," in gp:
                      la, lo = gp.split(",")[:2]
                  elif isinstance(gp, dict):
                      la, lo = gp.get("lat") or gp.get("latitude"), gp.get("lon") or gp.get("longitude")
              try:
                  return float(_lbl(la) if not isinstance(la, (int, float)) else la), float(_lbl(lo) if not isinstance(lo, (int, float)) else lo)
              except Exception:  # noqa: BLE001
                  return None, None


          def datatourisme(city):
              key = os.environ.get("DATATOURISME_KEY", "").strip()
              if not key:
                  log(f"  DATAtourisme {city}: pas de clé (le secret DATATOURISME_KEY est vide ou mal nommé)")
                  return []
              if slug(city) not in CITY_GEO:
                  log(f"  DATAtourisme {city}: ville sans coordonnées, ignorée")
                  return []
              lat, lon = CITY_GEO[slug(city)]
              today = dt.date.today().isoformat()
              # « fields » remplace la sélection par défaut de l'API, qui ne contient pas les dates (takesPlaceAt)
              base = (f"https://api.datatourisme.fr/v1/entertainmentAndEvent?geo_distance={lat},{lon},25km&page_size=100"
                      "&fields=uuid,label,type,takesPlaceAt,isLocatedAt,hasDescription,hasContact,hasMainRepresentation")
              out, url, pages, total, seen_n, past, sample = [], base + f"&takesPlaceAt.endDate%5Bgte%5D={today}", 0, None, 0, 0, None
              while url and pages < 15:
                  pages += 1
                  time.sleep(0.4)
                  try:
                      j = json.loads(get(url, headers={"X-API-Key": key, "Accept": "application/json"}))
                  except Exception as e:  # noqa: BLE001
                      if pages == 1 and "%5Bgte%5D" in url:
                          log(f"  DATAtourisme {city}: filtre de date refusé ({str(e)[:60]}), on filtre nous-mêmes")
                          url, pages = base, 0
                          continue
                      log(f"  DATAtourisme {city}: {str(e)[:120]}")
                      break
                  meta = (j.get("meta") or {}) if isinstance(j, dict) else {}
                  if total is None:
                      total = meta.get("total")
                  items = (j.get("objects") or j.get("results") or j.get("data") or []) if isinstance(j, dict) else (j if isinstance(j, list) else [])
                  for o in items:
                      seen_n += 1
                      sample = sample or o
                      per = [p for p in _dt_periods(o) if p[1][:10] >= today]
                      if not per:
                          past += 1
                          continue
                      start, end, st = per[0]
                      t = _lbl(o.get("label") or o.get("rdfs:label") or _find(o, ["label", "rdfs:label"]))
                      if not t:
                          continue
                      la, lo = _dt_geo(o)
                      town = _lbl(_find(o, ["addressLocality", "schema:addressLocality"])) or city
                      types = o.get("type") or o.get("@type") or []
                      tags = [x.split("#")[-1].split(":")[-1] for x in (types if isinstance(types, list) else [types]) if isinstance(x, str)]
                      desc = _lbl(_find(o, ["shortDescription", "dc:description", "description"]))
                      d = start[:10] + ("T" + st[:5] if isinstance(st, str) and re.match(r"\d\d:\d\d", st) else "T10:00")
                      if d[:10] < today:
                          d = today + "T10:00"
                      out.append({"id": "dt-" + str(o.get("uuid") or o.get("@id") or slug(t + start))[-40:], "src": "datatourisme", "kind": "local",
                                  "t": t, "d": d, "end": end[:10] if end[:10] != start[:10] else None,
                                  "v": town, "a": town, "city": town, "lat": la, "lon": lo,
                                  "p": None, "tags": tags, "desc": (desc or "")[:300], "img": "", "lineup": [],
                                  "link": _lbl(_find(o, ["homepage", "foaf:homepage", "url", "website"])) or ""})
                  nxt = meta.get("next")
                  url = ("https://api.datatourisme.fr" + nxt if isinstance(nxt, str) and nxt.startswith("/") else nxt) if nxt else None
              log(f"  DATAtourisme {city}: {len(out)} fêtes, brocantes et animations (réponse : {total} au total, {seen_n} lus, {past} déjà passés)")
              if not out and sample:
                  log("   aperçu d'une fiche : clés " + ",".join(list(sample.keys())[:25]) + " | takesPlaceAt " + json.dumps(sample.get("takesPlaceAt"), ensure_ascii=False)[:300])
              return out


