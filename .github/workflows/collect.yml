          def fnac(city):
              now = dt.datetime.now(dt.timezone.utc)
              out, seen = [], set()
              cat = urllib.parse.quote("Concerts & Festivals")
              for w in range(6):  # fenêtres de 2 mois sur 12 mois : le moteur ne renvoie que quelques centaines de résultats par recherche
                  a = (now + dt.timedelta(days=61 * w)).date().isoformat()
                  b = (now + dt.timedelta(days=61 * (w + 1))).date().isoformat()
                  for page in range(1, 16):
                      time.sleep(0.5)
                      try:
                          j = json.loads(get(f"{EVENTIM}&city={urllib.parse.quote(city)}&categories={cat}&date_from={a}&date_to={b}&page={page}",
                                             headers={"Accept": "application/json", "Origin": "https://www.fnacspectacles.com",
                                                      "Referer": "https://www.fnacspectacles.com/"}))
                      except Exception as e:  # noqa: BLE001
                          if not out and w == 0 and page == 1:
                              raise
                          log(f"   Fnac {a}: {e}")
                          break
                      gs = j.get("productGroups") or []
                      if not gs:
                          break
                      for g in gs:
                          subs = [c.get("name") for c in (g.get("categories") or []) if c.get("parentCategory")]
                          art = (g.get("mainAttraction") or {}).get("name") or ""
                          fest = any("festival" in (x or "").lower() for x in subs) or "festival" in (g.get("name") or "").lower()
                          for pr in g.get("products") or []:
                              le = ((pr.get("typeAttributes") or {}).get("liveEntertainment")) or {}
                              loc = le.get("location") or {}
                              pid = pr.get("productId")
                              if not pid or pid in seen or not le.get("startDate"):
                                  continue
                              if slug(loc.get("city") or "") != slug(city) and not slug(loc.get("city") or "").startswith(slug(city)):
                                  continue
                              seen.add(pid)
                              geo = loc.get("geoLocation") or {}
                              st = pr.get("status") or ""
                              path = ((pr.get("url") or {}).get("path")) or ""
                              out.append({"id": "fn-" + str(pid), "src": "fnac", "kind": "festival" if fest else "concert",
                                          "t": g.get("name") or pr.get("name") or "", "d": le["startDate"], "end": le.get("endDate"),
                                          "v": loc.get("name") or "", "a": " ".join(x for x in [loc.get("postalCode"), loc.get("city")] if x),
                                          "city": city, "lat": geo.get("latitude"), "lon": geo.get("longitude"), "p": None,
                                          "soldout": st.lower() in ("soldout", "sold_out"), "genres": subs,
                                          "img": (g.get("imageUrl") or "").replace("222x222", "600x600"),
                                          "rating": round(((pr.get("rating") or {}).get("average") or 0) * 2, 1) or None,
                                          "ratingCount": (pr.get("rating") or {}).get("count") or None,
                                          "link": "https://www.fnacspectacles.com" + path if path else pr.get("link"),
                                          "lineup": [art] if art else [], "desc": (g.get("description") or "")[:300]})
              log(f"  Fnac Spectacles {city}: {len(out)} dates de concerts")
              return out

