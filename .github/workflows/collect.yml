                      try:
                          pg = get(r["link"])
                      except Exception:  # noqa: BLE001
                          continue
                      ds = re.findall(r"(\d{1,2})\. ([A-Z][a-z]{2})\.? (20\d\d)", pg)
                      if not ds:
                          continue
                      def iso(x):
                          return f"{x[2]}-{MON_EN.get(x[1].lower(), 1):02d}-{int(x[0]):02d}"
                      img = re.search(r'<meta property="og:image" content="([^"]+)"', pg)
