                      offers = e.get("offers") or []
                      out.append({"id": "bit-" + str(e.get("id")), "src": "bit", "kind": "festival" if e.get("festival_start_date") else "concert",
                                  "artist": a, "t": e.get("title") or a, "d": e.get("datetime"), "end": None,
