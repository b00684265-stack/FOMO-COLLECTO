          def hyrox():
              out = []
              for page in range(1, 6):
                  time.sleep(PAUSE)
                  try:
                      rows = json.loads(get(f"https://hyrox.com/wp-json/wp/v2/event?per_page=100&page={page}&_fields=id,title,link"))
                  except Exception as e:  # noqa: BLE001
