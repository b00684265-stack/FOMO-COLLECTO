          def big_events():
              """Grandes affiches vérifiées (équipes de France, Six Nations, Coupe du monde, finales, Tour de France, Roland-Garros…)."""
              now = dt.datetime.now().isoformat()[:16]
              out = []
              for i, b in enumerate(BIG_EVENTS):
                  if (b.get("end") or b["d"]) < now[:10]:
                      continue
                  out.append({"id": "big-" + slug(b["t"] + b["d"][:10]), "src": "sport", "kind": "sport", "sport": b["sport"],
                              "comp": b["comp"], "level": b.get("level", "international"), "t": b["t"], "d": b["d"], "end": b.get("end"),
                              "v": b.get("venue", ""), "a": "", "city": b.get("city", ""), "country": b.get("country", "FR"),
                              "lat": None, "lon": None, "p": 0 if b.get("free") else None, "free": bool(b.get("free")),
                              "status": b.get("status", "announced"), "big": True, "img": "", "link": b.get("link", ""), "lineup": [], "desc": ""})
              return out


          def sports():
              now = dt.datetime.now(dt.timezone.utc)
              y = now.year if now.month >= 7 else now.year - 1
              out, french = [], set()
              for lid, sport, comp, rounds, kind in LEAGUES:
                  season = str(y + 1) if lid == 4714 else f"{y}-{y + 1}"
                  got, empty = 0, 0
                  for r in range(1, rounds + 1):
                      time.sleep(2.2)  # limite de la clé gratuite : 30 requêtes par minute
                      try:
                          j = json.loads(get(f"{SDB}eventsround.php?id={lid}&r={r}&s={season}"))
                      except Exception as e:  # noqa: BLE001
                          log(f"   ! {comp} J{r}: {e}")
                          continue
                      evs = j.get("events") or []
                      if not evs:
                          empty += 1
                          if empty >= 3 and got:
                              break
                          continue
                      for e in evs:
                          if str(e.get("idLeague")) != str(lid):
                              continue
                          home, away = e.get("strHomeTeam") or "", e.get("strAwayTeam") or ""
                          if kind == "national":
                              french.update([home, away])
                          ts = e.get("strTimestamp") or ""
                          try:
                              t = dt.datetime.fromisoformat(ts).replace(tzinfo=dt.timezone.utc)
                          except Exception:  # noqa: BLE001
                              continue
                          if t < now or t > now + dt.timedelta(days=HORIZON_DAYS):
                              continue
                          if kind != "national" and home not in french and home != "France":
                              continue  # on garde les matchs joués en France
                          got += 1
                          out.append({"status": "on_sale" if t < now + dt.timedelta(days=35) else "announced",
                                      "id": "sp-" + str(e.get("idEvent")), "src": "sport", "kind": "sport", "sport": sport,
                                      "comp": comp, "level": kind, "t": f"{home} – {away}", "home": home, "away": away,
                                      "d": t.isoformat(), "end": None, "v": e.get("strVenue") or "", "a": "",
                                      "city": e.get("strCity") or "", "lat": None, "lon": None, "p": None, "soldout": False,
                                      "img": e.get("strThumb") or e.get("strPoster") or "", "round": r,
                                      "link": "https://www.google.com/search?q=" + urllib.parse.quote(f"billetterie {home} {away} {comp}"),
                                      "lineup": [], "desc": ""})
                  log(f"  Sport {comp}: {got} matchs à venir")
              big = big_events()
              log(f"  Grandes affiches : {len(big)}")
              return big + out


          # ---------------- Compétitions : toutes les courses de France (Finishers) ----------------
          # Le moteur de recherche public du site Finishers (clé « recherche seule » fournie à tous ses visiteurs)
          FIN_TS = "https://vn2qtcjsbg0ea481p.a1.typesense.net/multi_search?x-typesense-api-key=G1BPjGr3KDU7n6yylcfOREpRVGUBpKYW"
          # FOMO affiche : course sur route, trail, Hyrox (et courses fitness), triathlon
          FIN_DISC = {"trail", "road", "triathlon", "cross_triathlon", "duathlon", "aquathlon", "swimrun", "fitnessrace"}


          # plateformes d'inscription : FOMO renvoie directement vers la page d'inscription plutôt que vers Finishers
          REG_DOMAINS = ("njuko.com", "protiming.fr", "klikego.com", "onsinscrit.com", "sportips.fr", "nextrun.fr", "tickrace.com", "ikinoa.com",
                         "espace-competition.com", "espacetri", "fftri.com", "yaka-inscription.com", "adeorun.com", "timepulse.fr", "l-chrono.com",
                         "chronometrage.com", "sportinnovation.fr", "endurancechrono.com", "ats-sport.com", "helloasso.com", "weezevent.com",
                         "billetweb.fr", "hyrox.com", "utmb.world", "ironman.com", "my.raceresult.com", "inscriptions", "inscription", "registration")
          SKIP_DOMAINS = ("finishers.com", "cloudinary.com", "facebook.com", "instagram.com", "twitter.com", "x.com", "youtube.com", "strava.com",
                          "google.", "apple.com", "tiktok.com", "linkedin.com", "marathons.com", "kavval")
          LINKS_PATH = os.path.join(DATA, "race-links.json")


          def _urls_in(o, keys=None):
              """Toutes les adresses web d'un document Finishers (et le nom du champ qui les porte)."""
              out = []
              def walk(x, k=""):
                  if isinstance(x, dict):
                      for kk, v in x.items():
                          walk(v, kk)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v, k)
                  elif isinstance(x, str) and x.startswith("http") and not any(d in x for d in SKIP_DOMAINS):
                      out.append((k, x))
              walk(o)
              return out


          def _pick_links(urls):
              reg = next((u for _, u in urls if any(d in u.lower() for d in REG_DOMAINS)), None)
              site = next((u for _, u in urls if u != reg), None)
              return reg, site


          def races_all():
              """Toutes les courses à venir en France sur 12 mois, en une soixantaine de requêtes (au lieu de 12 000 pages)."""
              now = dt.datetime.now(dt.timezone.utc)
              t0, t1 = int(now.timestamp()), int((now + dt.timedelta(days=730)).timestamp())  # N+1 au minimum
              fields = ("eventId,eventName,eventSlug,raceDate,raceEndDate,raceDiscipline,raceDistance,raceDistanceUnit,raceElevationGain,"
                        "city,level1,level2,coordinates,editionStatus,raceStatus,image,eventLastEditionFinisherCount,raceName,popularity")
              groups, page, total = {}, 1, None
              # première page complète : on repère les champs qui portent des liens (site officiel, inscription)
              try:
                  probe = {"searches": [{"collection": "races", "q": "*", "query_by": "eventName", "filter_by": f"raceDate:>={t0} && countryCode:=FR",
                                         "per_page": 40}]}
                  docs = [h.get("document") or {} for h in json.loads(get(FIN_TS, data=json.dumps(probe).encode(), headers={"Content-Type": "application/json"}))["results"][0].get("hits", [])]
                  lk = sorted({k for d in docs for k, _ in _urls_in(d) if k})
                  log(f"  Finishers : champs avec liens {lk or 'aucun'}")
                  if lk:
                      fields += "," + ",".join(lk)
              except Exception as e:  # noqa: BLE001
                  log(f"  Finishers (champs) : {e}")
              while page <= 120:
                  body = {"searches": [{"collection": "races", "q": "*", "query_by": "eventName", "include_fields": fields,
                                        "filter_by": f"raceDate:>={t0} && raceDate:<={t1} && countryCode:=FR",
                                        "sort_by": "raceDate:asc", "page": page, "per_page": 250}]}
                  res = json.loads(get(FIN_TS, data=json.dumps(body).encode(), headers={"Content-Type": "application/json"}))["results"][0]
                  if res.get("error"):
                      raise RuntimeError(res["error"])
                  total = res.get("found", 0)
                  hits = res.get("hits") or []
                  for h in hits:
                      r = h.get("document") or {}
                      disc = r.get("raceDiscipline") or ""
                      if disc not in FIN_DISC or (r.get("editionStatus") or "") == "cancelled" or (r.get("raceStatus") or "") == "cancelled":
                          continue
                      if disc == "fitnessrace" and "hyrox" not in (r.get("eventName") or "").lower():
                          continue
                      g = groups.setdefault(r["eventId"], {"doc": r, "races": [], "urls": []})
                      g["urls"] += _urls_in(r)
                      dist = r.get("raceDistance") or 0
                      km = round(dist / 1000, 1) if (r.get("raceDistanceUnit") or "meters") == "meters" else dist
                      g["races"].append({"name": (r.get("raceName") or [None])[0] if isinstance(r.get("raceName"), list) else r.get("raceName"),
                                         "disc": disc, "km": km, "dplus": r.get("raceElevationGain"),
                                         "date": dt.datetime.fromtimestamp(r["raceDate"], dt.timezone.utc).date().isoformat()})
                  if len(hits) < 250 or page * 250 >= total:
                      break
                  page += 1
                  time.sleep(0.6)
              out = []
              for eid, g in groups.items():
                  r, rs = g["doc"], sorted(g["races"], key=lambda x: (x["date"], -(x["km"] or 0)))
                  d0 = min(x["date"] for x in rs)
                  end = max(x["date"] for x in rs)
                  co = r.get("coordinates") or [None, None]
                  out.append({"id": "f-" + (r.get("eventSlug") or eid), "src": "finishers", "kind": "race", "t": r.get("eventName") or "",
                              "d": d0, "end": end if end != d0 else None, "tba": (r.get("editionStatus") or "") != "confirmed",
                              "v": r.get("city") or r.get("level2") or "", "a": ", ".join(x for x in [r.get("level2"), r.get("level1")] if x),
                              "city": r.get("city") or r.get("level2") or "", "lat": co[0], "lon": co[1],
                              "races": rs[:8], "p": None, "pop": r.get("eventLastEditionFinisherCount") or 0,
                              "img": ("https://res.cloudinary.com/kavval/image/upload/w_600,q_auto,f_auto/" + r["image"]) if r.get("image") else "",
                              "link": f"https://www.finishers.com/course/{r.get('eventSlug')}", "lineup": [], "desc": "",
                              "_urls": g["urls"], "_slug": r.get("eventSlug")})
              out.sort(key=lambda e: e["d"])
              log(f"  Finishers: {len(out)} épreuves en France ({total} courses trouvées)")
              race_links(out)
              return out


          def race_links(out):
              """Lien direct vers l'inscription : d'abord les champs Finishers, sinon la fiche Finishers (bouton « S'inscrire »),
              lue une fois puis gardée en mémoire dans data/race-links.json (quelques centaines de nouvelles fiches par nuit)."""
              try:
                  cache = json.load(open(LINKS_PATH, encoding="utf-8"))
              except Exception:  # noqa: BLE001
                  cache = {}
              today = dt.date.today()
              todo = []
              for e in out:
                  urls, slug_ = e.pop("_urls", []), e.pop("_slug", None)
                  reg, site = _pick_links(urls)
                  c = cache.get(slug_ or "") or {}
                  reg, site = reg or c.get("reg"), site or c.get("site")
                  if not reg and slug_ and slug_ not in cache:
                      todo.append(e)
                  if reg:
                      e["reg"] = reg
                  if site:
                      e["site"] = site
              # fiches à lire : d'abord les courses dont les inscriptions sont ouvertes et proches, puis les plus courues
              todo.sort(key=lambda e: (e.get("tba", False), e["d"], -(e.get("pop") or 0)))
              n = 0
              for e in todo[:LIMITS.get("race_pages", 300)]:
                  slug_ = e["link"].rsplit("/", 1)[-1]
                  time.sleep(0.5)
                  try:
                      page = get(e["link"])
                  except Exception as ex:  # noqa: BLE001
                      cache[slug_] = {"at": today.isoformat(), "err": str(ex)[:60]}
                      continue
                  hrefs = [html.unescape(h) for h in re.findall(r'href="(https?://[^"]+)"', page)]
                  reg, site = _pick_links([("", h) for h in hrefs if not any(d in h for d in SKIP_DOMAINS)])
                  cache[slug_] = {"reg": reg, "site": site, "at": today.isoformat()}
                  if reg:
                      e["reg"] = reg
                      n += 1
                  if site:
                      e["site"] = site
              # on ne garde pas en mémoire les courses passées
              keep = {e["link"].rsplit("/", 1)[-1] for e in out}
              cache = {k: v for k, v in cache.items() if k in keep}
              json.dump(cache, open(LINKS_PATH, "w", encoding="utf-8"), ensure_ascii=False)
              nreg = sum(1 for e in out if e.get("reg"))
